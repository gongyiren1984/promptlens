[package]
name = "promptlens-desktop"
version = "0.1.0"
description = "PromptLens 提示镜桌面壳"
authors = ["PromptLens"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "promptlens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
